@switch (level()) {
  @case (1) {
    <h1 class="heading" [class.heading--gradient]="gradient()">{{ text() }}</h1>
  }
  @case (2) {
    <h2 class="heading" [class.heading--gradient]="gradient()">{{ text() }}</h2>
  }
  @case (3) {
    <h3 class="heading" [class.heading--gradient]="gradient()">{{ text() }}</h3>
  }
  @default {
    <h4 class="heading" [class.heading--gradient]="gradient()">{{ text() }}</h4>
  }
}

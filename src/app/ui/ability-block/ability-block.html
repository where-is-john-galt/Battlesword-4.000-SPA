@let a = ability();

<div class="ability">
  @if (a.name) {
    <h4 class="ability__name">{{ a.name }}</h4>
  }
  <p class="ability__desc">{{ a.description }}</p>
  @if (a.effects?.length) {
    <ul class="ability__effects">
      @for (effect of a.effects; track effect) {
        <li>{{ effect }}</li>
      }
    </ul>
  }
</div>

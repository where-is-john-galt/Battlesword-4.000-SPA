<button
  class="favorite"
  type="button"
  [class.favorite--active]="active()"
  (click)="toggle()"
  [attr.aria-pressed]="active()"
  [attr.aria-label]="active() ? 'Usuń z ulubionych' : 'Dodaj do ulubionych'"
>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path
      d="M12 2.5l2.9 5.9 6.5.95-4.7 4.58 1.1 6.47L12 17.34 6.2 20.4l1.1-6.47L2.6 9.35l6.5-.95L12 2.5z"
      fill="currentColor"
    />
  </svg>
</button>

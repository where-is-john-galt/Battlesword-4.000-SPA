<app-card-shell [type]="'handItem'" [id]="handItem().id">
  <a class="card-title" [routerLink]="['/karta', 'handItem', handItem().id]">{{ handItem().name }}</a>

  <app-tag [label]="handItem().category" />

  <div class="card-section">
    @if (handItem().requiredWealth !== undefined) {
      <div class="stat">
        <span class="stat__label">Majętność</span>
        <span class="stat__value">{{ handItem().requiredWealth }}</span>
      </div>
    }
    @if (handItem().uses !== undefined) {
      <div class="stat">
        <span class="stat__label">Użyć</span>
        <span class="stat__value">{{ handItem().uses }}</span>
      </div>
    }
    @if (handItem().effect; as effect) {
      <div class="stat">
        <span class="stat__label">Efekt</span>
        <span class="stat__value"><app-linked-text [text]="effect" /></span>
      </div>
    }
  </div>
</app-card-shell>

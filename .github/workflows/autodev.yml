name: Autonomous compendium development

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: battlesword-autodev
  cancel-in-progress: false

jobs:
  develop:
    if: vars.AUTODEV_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the application
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Fetch the current Battlesword source
        id: source
        shell: bash
        run: |
          git -C Battlesword-4.000 fetch --unshallow origin master || git -C Battlesword-4.000 fetch origin master
          source_sha="$(git -C Battlesword-4.000 rev-parse origin/master)"
          git -C Battlesword-4.000 checkout --detach "$source_sha"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Load queue and claim catch-up batch
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          AUTODEV_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: node scripts/autodev/state.mjs prepare

      - name: Build isolated agent image
        if: steps.prepare.outputs.has_work == 'true' && steps.prepare.outputs.deploy_only != 'true' && steps.prepare.outputs.sync_pointer_only != 'true'
        run: docker build --pull --tag battlesword-autodev:1.19.0 --file .github/autodev/Dockerfile .github/autodev

      - name: Start the metered DeepSeek gateway
        id: gateway
        if: steps.prepare.outputs.has_work == 'true' && steps.prepare.outputs.deploy_only != 'true' && steps.prepare.outputs.sync_pointer_only != 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AUTODEV_DAILY_REMAINING: ${{ steps.prepare.outputs.available_budget }}
        shell: bash
        run: |
          test -n "$DEEPSEEK_API_KEY" || { echo 'DEEPSEEK_API_KEY repository secret is missing.' >&2; exit 1; }
          proxy_token="$(openssl rand -hex 32)"
          echo "::add-mask::$proxy_token"
          echo "proxy_token=$proxy_token" >> "$GITHUB_OUTPUT"
          echo '{"spent":0,"reserved":0,"requests":0}' > "$RUNNER_TEMP/autodev-usage.json"
          nohup env \
            DEEPSEEK_API_KEY="$DEEPSEEK_API_KEY" \
            AUTODEV_PROXY_TOKEN="$proxy_token" \
            AUTODEV_DAILY_REMAINING="$AUTODEV_DAILY_REMAINING" \
            AUTODEV_ATTEMPT_BUDGET=2 \
            AUTODEV_USAGE_FILE="$RUNNER_TEMP/autodev-usage.json" \
            node scripts/autodev/deepseek-proxy.mjs \
            > "$RUNNER_TEMP/autodev-proxy.log" 2>&1 < /dev/null &
          echo "$!" > "$RUNNER_TEMP/autodev-proxy.pid"
          for attempt in {1..30}; do
            if curl --silent --output /dev/null http://127.0.0.1:4317/health; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/autodev-proxy.log"
          exit 1

      - name: Run OpenCode in an isolated container
        id: agent
        if: steps.prepare.outputs.has_work == 'true' && steps.prepare.outputs.deploy_only != 'true' && steps.prepare.outputs.sync_pointer_only != 'true'
        env:
          AUTODEV_TASK_FILE: ${{ steps.prepare.outputs.task_file }}
          AUTODEV_PROXY_TOKEN: ${{ steps.gateway.outputs.proxy_token }}
          AUTODEV_REVIEW_FILE: ${{ github.workspace }}/.autodev-runtime/review.json
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.autodev-runtime"
          cp "$AUTODEV_TASK_FILE" "$GITHUB_WORKSPACE/.autodev-runtime/task.json"
          timeout --signal=TERM --kill-after=30s 2700 docker run --rm \
            --init \
            --ipc=host \
            --user "$(id -u):$(id -g)" \
            --add-host=host.docker.internal:host-gateway \
            --tmpfs /tmp:rw,nosuid,nodev,exec,uid="$(id -u)",gid="$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$GITHUB_WORKSPACE/.git:/workspace/.git:ro" \
            --workdir /workspace \
            --env DEEPSEEK_BASE_URL=http://host.docker.internal:4317/v1 \
            --env DEEPSEEK_API_KEY="$AUTODEV_PROXY_TOKEN" \
            --env AUTODEV_PROXY_TOKEN="$AUTODEV_PROXY_TOKEN" \
            --env AUTODEV_TASK_FILE=/workspace/.autodev-runtime/task.json \
            --env AUTODEV_RESULT_FILE=/workspace/.autodev-runtime/result.json \
            --env AUTODEV_RESULT_SUMMARY=/workspace/.autodev-runtime/summary.json \
            --env AUTODEV_LOG_FILE=/workspace/.autodev-runtime/agent.log \
            --env GIT_OPTIONAL_LOCKS=0 \
            battlesword-autodev:1.19.0 \
            bash -lc 'opencode debug config --pure >/dev/null && node scripts/autodev/run-opencode.mjs'

      - name: Stop the DeepSeek gateway
        if: always() && steps.gateway.outcome == 'success'
        run: kill "$(cat "$RUNNER_TEMP/autodev-proxy.pid")" || true

      - name: Verify agent result and protected files
        id: validate
        if: steps.prepare.outputs.has_work == 'true' && steps.prepare.outputs.deploy_only != 'true' && steps.prepare.outputs.sync_pointer_only != 'true'
        env:
          AUTODEV_TASK_FILE: ${{ steps.prepare.outputs.task_file }}
          AUTODEV_RESULT_FILE: ${{ github.workspace }}/.autodev-runtime/result.json
          AUTODEV_REVIEW_FILE: ${{ github.workspace }}/.autodev-runtime/review.json
          AUTODEV_EXPECTED_HEAD: ${{ github.sha }}
          AUTODEV_VALIDATED_REPORT: ${{ github.workspace }}/.autodev-runtime/validated-report.json
        run: |
          for protected in .github/workflows/autodev.yml .github/autodev .opencode scripts/autodev AGENTS.md; do
            if ! git diff --quiet HEAD -- "$protected"; then
              echo "The agent changed protected automation path: $protected" >&2
              exit 1
            fi
          done
          node scripts/autodev/validate.mjs
          node -e "const r=require(process.env.AUTODEV_VALIDATED_REPORT); require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'has_changes='+String(r.changedFiles.length>0)+'\\nhas_repository_changes='+String(r.changedFiles.length>0)+'\\nsummary='+r.summary.replace(/[\\r\\n]/g,' ')+'\\n')"

      - name: Verify the automation budget gateway
        if: steps.prepare.outputs.has_work == 'true' && steps.prepare.outputs.deploy_only != 'true' && steps.prepare.outputs.sync_pointer_only != 'true'
        run: npm run test:autodev

      - name: Run Angular unit tests
        if: steps.prepare.outputs.has_work == 'true' && steps.prepare.outputs.deploy_only != 'true' && steps.prepare.outputs.sync_pointer_only != 'true'
        run: |
          npm ci
          npm test -- --watch=false

      - name: Run Playwright browser tests
        if: steps.prepare.outputs.has_work == 'true' && steps.prepare.outputs.deploy_only != 'true' && steps.prepare.outputs.sync_pointer_only != 'true'
        run: |
          docker run --rm --init --ipc=host \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,nodev,exec,uid="$(id -u)",gid="$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env CI=true \
            battlesword-autodev:1.19.0 \
            npx playwright test

      - name: Build for GitHub Pages
        if: steps.prepare.outputs.has_work == 'true' && steps.prepare.outputs.deploy_only != 'true' && steps.prepare.outputs.sync_pointer_only != 'true'
        run: npx ng build --configuration production --base-href /Battlesword-4.000-SPA/

      - name: Publish the validated change
        id: publish
        if: steps.prepare.outputs.has_work == 'true' && steps.prepare.outputs.deploy_only != 'true' && steps.prepare.outputs.sync_pointer_only != 'true' && steps.validate.outputs.has_repository_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
          git add -u -- . ':(exclude)Battlesword-4.000'
          git ls-files --others --exclude-standard -z | xargs -0 -r git add --
          git commit -m "feat(compendium): autonomously update from Battlesword"
          git push origin HEAD:main
          echo "pushed_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Finalize Battlesword source pointer after the full audit
        if: steps.prepare.outputs.sync_pointer_only == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
          git add -u -- Battlesword-4.000
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: sync Battlesword source after full audit"
          git push origin HEAD:main

      - name: Deploy the published commit
        id: deploy
        if: steps.prepare.outputs.has_work == 'true' && (steps.prepare.outputs.deploy_only == 'true' || steps.validate.outputs.has_changes == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha='${{ steps.prepare.outputs.deploy_sha || steps.publish.outputs.pushed_sha }}'
          if [[ -z "$sha" ]]; then sha='${{ steps.publish.outputs.pushed_sha }}'; fi
          node scripts/autodev/dispatch-deploy.mjs "$sha"
          echo "deployed_sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Record task outcome
        if: always() && steps.prepare.outputs.has_work == 'true' && steps.prepare.outputs.sync_pointer_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AUTODEV_TASK_ID: ${{ steps.prepare.outputs.task_id }}
          AUTODEV_USAGE_FILE: ${{ runner.temp }}/autodev-usage.json
          AUTODEV_JOB_SUCCESS: ${{ job.status == 'success' }}
          AUTODEV_HAS_CHANGES: ${{ steps.validate.outputs.has_changes }}
          AUTODEV_PUSHED_SHA: ${{ steps.publish.outputs.pushed_sha }}
          AUTODEV_DEPLOYED_SHA: ${{ steps.deploy.outputs.deployed_sha }}
          AUTODEV_SUMMARY: ${{ steps.validate.outputs.summary }}
          AUTODEV_FAILURE_REASON: 'Jedno z niezależnych sprawdzeń agenta, publikacji lub deploymentu zakończyło się błędem.'
        run: node scripts/autodev/state.mjs finish

      - name: Upload agent report and traces
        if: always() && steps.prepare.outputs.deploy_only != 'true' && steps.prepare.outputs.sync_pointer_only != 'true' && steps.prepare.outputs.has_work == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: autodev-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/.autodev-runtime/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
